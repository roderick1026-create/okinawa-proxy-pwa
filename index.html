<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>沖繩代購 V2.1</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans TC", sans-serif;
      background: #fbf7ef;
      color: #17324d;
    }

    .page {
      min-height: 100vh;
      padding: 28px 16px 50px;
    }

    .app {
      width: 100%;
      max-width: 460px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .jp {
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .version {
      color: #64748b;
      margin-top: 8px;
      font-size: 15px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      font-size: 17px;
      font-weight: 800;
      background: #173a59;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
    }

    .status {
      margin-top: 15px;
      padding: 14px;
      border-radius: 14px;
      background: #f1f5f9;
      line-height: 1.7;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .summaryBox {
      background: #f8fafc;
      border-radius: 14px;
      padding: 14px;
    }

    .summaryLabel {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .summaryValue {
      font-size: 20px;
      font-weight: 800;
      color: #17324d;
    }

    .sectionTitle {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .order {
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 12px;
      background: #fff;
    }

    .order.cancelled {
      opacity: .55;
      background: #f8fafc;
    }

    .orderTop {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .orderId {
      font-weight: 800;
    }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 700;
      background: #e0f2fe;
      color: #075985;
    }

    .cancelBadge {
      background: #fee2e2;
      color: #991b1b;
    }

    .row {
      line-height: 1.75;
      color: #334155;
      word-break: break-word;
    }

    .empty {
      text-align: center;
      padding: 28px 10px;
      color: #64748b;
    }

    .syncTime {
      margin-top: 12px;
      font-size: 13px;
      color: #64748b;
      text-align: center;
    }

    #dataArea {
      display: none;
    }
  </style>
</head>

<body>

<div class="page">
  <div class="app">

    <div class="header">
      <div class="jp">JP</div>
      <h1>沖繩代購</h1>
      <div class="version">
        PWA V2.1｜Google Sheets 唯讀同步
      </div>
    </div>

    <div class="card">

      <button id="loadBtn" onclick="loadData()">
        🔄 讀取 Google Sheets 資料
      </button>

      <div id="status" class="status">
        尚未同步
      </div>

    </div>

    <div id="dataArea">

      <div class="card">

        <div class="sectionTitle">
          📊 同步摘要
        </div>

        <div class="summary">

          <div class="summaryBox">
            <div class="summaryLabel">📋 訂單</div>
            <div id="orderCount" class="summaryValue">0 筆</div>
          </div>

          <div class="summaryBox">
            <div class="summaryLabel">🛒 採買紀錄</div>
            <div id="purchaseCount" class="summaryValue">0 筆</div>
          </div>

          <div class="summaryBox">
            <div class="summaryLabel">💱 目前匯率</div>
            <div id="rate" class="summaryValue">-</div>
          </div>

          <div class="summaryBox">
            <div class="summaryLabel">⚙️ 後端版本</div>
            <div id="backendVersion" class="summaryValue">-</div>
          </div>

        </div>

        <div id="syncTime" class="syncTime"></div>

      </div>


      <div class="card">

        <div class="sectionTitle">
          📋 Google Sheet 現有訂單
        </div>

        <div id="orderList"></div>

      </div>

    </div>

  </div>
</div>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbxb56_ensfbWU_Znz1MYFVm5BEFJzZ-_O-nRNWj4VIyyN7ClPob7vNz5A6SUckbYEXV/exec';


async function loadData() {

  const btn = document.getElementById('loadBtn');
  const status = document.getElementById('status');

  btn.disabled = true;
  btn.textContent = '⟳ 正在同步…';

  status.className = 'status';
  status.innerHTML = '正在從 Google Sheets 取得最新資料…';

  try {

    const response = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify({
        v2: true,
        action: 'getData'
      }),
      redirect: 'follow'
    });

    const text = await response.text();

    let data;

    try {
      data = JSON.parse(text);
    } catch (e) {
      throw new Error(
        '伺服器回傳的內容不是有效 JSON'
      );
    }

    if (!data || data.ok !== true) {
      throw new Error(
        data && data.message
          ? data.message
          : '後端沒有回傳有效資料'
      );
    }

    const orders =
      Array.isArray(data.orders)
        ? data.orders
        : [];

    const purchases =
      Array.isArray(data.purchases)
        ? data.purchases
        : [];

    document.getElementById('orderCount').textContent =
      orders.length + ' 筆';

    document.getElementById('purchaseCount').textContent =
      purchases.length + ' 筆';

    document.getElementById('rate').textContent =
      Number(data.rate || 0).toFixed(3);

    document.getElementById('backendVersion').textContent =
      data.version || '?';

    document.getElementById('syncTime').textContent =
      '☁ 最後同步：' +
      (data.syncedAt || new Date().toLocaleString('zh-TW'));

    renderOrders(orders);

    document.getElementById('dataArea').style.display =
      'block';

    status.className = 'status success';

    status.innerHTML =
      '<strong>✅ Google Sheets 同步成功</strong><br>' +
      '已取得 ' +
      orders.length +
      ' 筆訂單、' +
      purchases.length +
      ' 筆採買紀錄。';

  } catch (error) {

    console.error(error);

    status.className = 'status error';

    status.innerHTML =
      '<strong>❌ Google Sheets 同步失敗</strong><br>' +
      escapeHtml(error.message);

    document.getElementById('dataArea').style.display =
      'none';

  } finally {

    btn.disabled = false;
    btn.textContent = '🔄 重新同步最新資料';

  }

}


function renderOrders(orders) {

  const box = document.getElementById('orderList');

  if (!orders.length) {

    box.innerHTML =
      '<div class="empty">' +
      '目前 API 沒有取得任何訂單。' +
      '</div>';

    return;
  }


  box.innerHTML = orders.map(function(order) {

    const cancelled =
      order.cancelled === true;

    const id =
      order.id != null
        ? order.id
        : '';

    const customer =
      order.customer != null
        ? order.customer
        : '';

    const product =
      order.product != null
        ? order.product
        : '';

    const qty =
      order.qty != null
        ? order.qty
        : '';

    const creator =
      order.creator != null
        ? order.creator
        : '';

    const saleTotal =
      order.saleTotal != null
        ? order.saleTotal
        : '';

    return (
      '<div class="order ' +
      (cancelled ? 'cancelled' : '') +
      '">' +

        '<div class="orderTop">' +

          '<div class="orderId">' +
            '#' + escapeHtml(id) +
          '</div>' +

          (
            cancelled
              ? '<span class="badge cancelBadge">已取消</span>'
              : '<span class="badge">有效訂單</span>'
          ) +

        '</div>' +

        '<div class="row">' +
          '👤 顧客：' +
          escapeHtml(customer) +
        '</div>' +

        '<div class="row">' +
          '🛍 商品：' +
          escapeHtml(product) +
        '</div>' +

        '<div class="row">' +
          '🔢 數量：' +
          escapeHtml(qty) +
        '</div>' +

        (
          creator
            ? '<div class="row">✍️ 建單人：' +
              escapeHtml(creator) +
              '</div>'
            : ''
        ) +

        (
          saleTotal !== ''
            ? '<div class="row">💰 訂單售價：NT$' +
              formatNumber(saleTotal) +
              '</div>'
            : ''
        ) +

      '</div>'
    );

  }).join('');

}


function formatNumber(value) {

  const n = Number(value);

  if (!Number.isFinite(n)) {
    return escapeHtml(value);
  }

  return Math.round(n).toLocaleString('zh-TW');

}


function escapeHtml(value) {

  return String(
    value == null ? '' : value
  )
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');

}

</script>

</body>
</html>
