<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>沖繩代購 V2.3</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  background:#fbf7ef;
  color:#17324d;
}

.page{
  min-height:100vh;
  padding:20px 14px 60px;
}

.app{
  width:100%;
  max-width:460px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:18px;
}

.jp{

}

h1{
  margin:4px 0 0;
  font-size:30px;
}

.version{
  margin-top:7px;
  color:#64748b;
  font-size:14px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 8px 30px rgba(0,0,0,.06);
}

.sectionTitle{
  font-size:18px;
  font-weight:900;
  margin-bottom:15px;
}

label{
  display:block;
  font-size:14px;
  font-weight:800;

}

input{
  width:100%;

  border-radius:12px;
  padding:13px;
  font-size:16px;
  background:white;

input:focus{
  outline:2px solid #bfdbfe;

}

.userButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.userBtn{
  border:1px solid #cbd5e1;

  border-radius:13px;
  padding:13px;
  font-size:16px;
  font-weight:900;
}

.userBtn.active{
  background:#173a59;
  color:white;
  border-color:#173a59;
}

.mainBtn{
  width:100%;
  border:0;
  border-radius:14px;
  padding:16px;
  margin-top:18px;
  background:#173a59;
  color:white;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
}

.mainBtn:disabled{
  opacity:.55;
}

.syncBtn{
  margin-top:0;
}

.status{
  margin-top:14px;
  padding:14px;
  border-radius:14px;
  background:#f1f5f9;
  line-height:1.6;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.totalBox{
  margin-top:15px;
  padding:14px;
  border-radius:14px;
  background:#f1f5f9;
}

.totalLabel{
  color:#64748b;
  font-size:13px;
}

.totalValue{
  font-size:23px;
  font-weight:900;
  margin-top:3px;
}

.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.summaryBox{
  background:#f8fafc;
  border-radius:14px;
  padding:14px;
}

.summaryLabel{
  font-size:13px;
  color:#64748b;
}

.summaryValue{
  font-size:20px;
  font-weight:900;
  margin-top:4px;
}

.syncTime{
  text-align:center;
  margin-top:12px;
  color:#64748b;
  font-size:12px;
}

/* 採買 */

.buyItem{
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
}

.buyDone{
  background:#f0fdf4;
}

.buyTitle{
  font-weight:900;
  font-size:17px;
  margin-bottom:10px;
}

.buyStats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-bottom:10px;
}

.stat{
  text-align:center;
  padding:9px 4px;
  border-radius:10px;
  background:#f8fafc;
}

.statLabel{
  font-size:11px;
  color:#64748b;
}

.statValue{
  font-size:18px;
  font-weight:900;
  margin-top:2px;
}

.need{
  background:#fff7ed;
}

.done{
  background:#dcfce7;
}

.buyBtn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:12px;
  background:#173a59;
  color:white;
  font-size:15px;
  font-weight:900;
}

.buyBtn:disabled{
  background:#94a3b8;
}

/* 訂單 */

.order{
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:15px;
  margin-bottom:11px;
}

.order.cancelled{
  opacity:.55;
  background:#f8fafc;
}

.orderTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:9px;
}

.orderId{
  font-weight:900;
}

.badge{
  padding:4px 9px;
  border-radius:999px;
  background:#e0f2fe;
  color:#075985;
  font-size:12px;
  font-weight:800;
}

.cancelBadge{
  background:#fee2e2;
  color:#991b1b;
}

.row{
  color:#334155;
  line-height:1.7;
  word-break:break-word;
}

.empty{
  text-align:center;
  color:#64748b;
  padding:22px 5px;
}

/* 採買輸入視窗 */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.45);
  z-index:999;
  padding:20px;
  align-items:flex-end;
  justify-content:center;
}

.modal.open{
  display:flex;
}

.modalSheet{
  width:100%;
  max-width:460px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:22px;
  padding:20px;
}

.modalTitle{
  font-size:20px;
  font-weight:900;
}

.modalSub{
  color:#64748b;

  line-height:1.5;
}

.cancelBtn{
  width:100%;
  border:1px solid #cbd5e1;
  background:white;
  color:#334155;
  border-radius:14px;
  padding:14px;
  margin-top:9px;
  font-size:16px;
  font-weight:800;
}

.warning{
  margin-top:10px;
  padding:10px;
  background:#fff7ed;
  color:#9a3412;

}
</style>
</head>

<body>

<div class="page">
<div class="app">

<div class="header">
  <div class="jp">JP</div>
  <h1>沖繩代購</h1>
  <div class="version">
    PWA V2.3｜建立訂單＋採買＋跨手機同步
  </div>
</div>


<!-- 建立訂單 -->

<div class="card">

  <div class="sectionTitle">📝 建立訂單</div>

  <label>🙋 操作人</label>

  <div class="userButtons">
    <button id="user秉謙" class="userBtn"
      onclick="selectUser('秉謙')">秉謙</button>

    <button id="user孟欣" class="userBtn"
      onclick="selectUser('孟欣')">孟欣</button>
  </div>

  <label>👤 顧客</label>
  <input id="customer" placeholder="輸入顧客姓名">

  <label>🛍 商品</label>
  <input id="product" placeholder="輸入商品名稱">

  <label>🔢 數量</label>
  <input id="qty" type="number" min="1" value="1"
    oninput="updateTotal()">

  <label>🇯🇵 日幣售價／件</label>
  <input id="price" type="number" min="0" value="0">

  <label>🇹🇼 代購台幣售價／件</label>
  <input id="twdPrice" type="number" min="0" value="0"
    oninput="updateTotal()">

  <div class="totalBox">
    <div class="totalLabel">💰 訂單台幣總額</div>
    <div id="twdTotal" class="totalValue">NT$0</div>
  </div>

  <button id="createBtn" class="mainBtn"
    onclick="createOrder()">
    ➕ 建立訂單
  </button>

  <div id="createStatus" class="status">
    尚未建立訂單
  </div>

</div>


<!-- 採買清單 -->

<div class="card">

  <div class="sectionTitle">🛒 採買清單</div>

  <div id="buyList">
    <div class="empty">正在等待同步…</div>
  </div>

</div>


<!-- 同步 -->

<div class="card">

  <button id="syncBtn"
    class="mainBtn syncBtn"
    onclick="loadData()">
    🔄 同步最新資料
  </button>

  <div id="syncStatus" class="status">
    尚未同步
  </div>

</div>


<!-- 摘要 -->

<div class="card">

  <div class="sectionTitle">📊 同步摘要</div>

  <div class="summary">

    <div class="summaryBox">
      <div class="summaryLabel">📋 訂單</div>
      <div id="orderCount" class="summaryValue">-</div>
    </div>

    <div class="summaryBox">
      <div class="summaryLabel">🛒 採買紀錄</div>
      <div id="purchaseCount" class="summaryValue">-</div>
    </div>

    <div class="summaryBox">
      <div class="summaryLabel">💱 目前匯率</div>
      <div id="rate" class="summaryValue">-</div>
    </div>

    <div class="summaryBox">
      <div class="summaryLabel">⚙️ 後端版本</div>
      <div id="backendVersion" class="summaryValue">-</div>
    </div>

  </div>

  <div id="syncTime" class="syncTime"></div>

</div>


<!-- 訂單 -->

<div class="card">

  <div class="sectionTitle">
    📋 Google Sheet 現有訂單
  </div>

  <div id="orderList">
    <div class="empty">正在等待同步…</div>
  </div>

</div>

</div>
</div>


<!-- 採買 Modal -->

<div id="buyModal" class="modal">

<div class="modalSheet">

  <div class="modalTitle">
    🛒 登記採買
  </div>

  <div id="buyProductName" class="modalSub"></div>

  <div id="buyNeedInfo" class="status"></div>

  <label>🙋 採買人</label>

  <div class="userButtons">
    <button id="buyUser秉謙"
      class="userBtn"
      onclick="selectUser('秉謙')">
      秉謙
    </button>

    <button id="buyUser孟欣"
      class="userBtn"
      onclick="selectUser('孟欣')">
      孟欣
    </button>
  </div>

  <label>🔢 本次採買數量</label>
  <input id="buyQty"
    type="number"
    min="1"
    value="1"
    oninput="checkOverBuy()">

  <div id="overBuyWarning" class="warning"></div>

  <label>💴 實際總成本 ¥</label>
  <input id="buyCost"
    type="number"
    min="0"
    value="0">

  <label>🏬 店家／備註</label>
  <input id="buyNote"
    placeholder="例如：國際通、唐吉訶德">

  <button id="saveBuyBtn"
    class="mainBtn"
    onclick="savePurchase()">
    ✅ 確認採買
  </button>

  <button class="cancelBtn"
    onclick="closeBuyModal()">
    取消
  </button>

  <div id="buyStatus"></div>

</div>
</div>


<script>

const API_URL =
'https://script.google.com/macros/s/AKfycbxb56_ensfbWU_Znz1MYFVm5BEFJzZ-_O-nRNWj4VIyyN7ClPob7vNz5A6SUckbYEXV/exec';

let currentUser =
  localStorage.getItem('okinawa_v2_user') || '';

let currentData = {
  orders:[],
  purchases:[]
};

let currentBuyProduct = '';
let currentBuyLeft = 0;


/* =========================
   使用者
========================= */

function selectUser(user){

  currentUser=user;

  localStorage.setItem(
    'okinawa_v2_user',
    user
  );

  document.querySelectorAll('.userBtn')
    .forEach(function(btn){
      btn.classList.remove('active');
    });

  ['user'+user,'buyUser'+user]
    .forEach(function(id){
      const el=document.getElementById(id);
      if(el) el.classList.add('active');
    });
}


function restoreUser(){

  if(
    currentUser==='秉謙' ||
    currentUser==='孟欣'
  ){
    selectUser(currentUser);
  }
}


/* =========================
   訂單金額
========================= */

function updateTotal(){

  const qty=
    Number(document.getElementById('qty').value)||0;

  const twd=
    Number(document.getElementById('twdPrice').value)||0;

  document.getElementById('twdTotal').textContent=
    'NT$'+Math.round(qty*twd).toLocaleString('zh-TW');
}


/* =========================
   API
========================= */

async function apiRequest(action,payload){

  const response=await fetch(API_URL,{
    method:'POST',

    headers:{
      'Content-Type':'text/plain;charset=utf-8'
    },

    body:JSON.stringify({
      v2:true,
      action:action,
      payload:payload||{}
    }),

    redirect:'follow'
  });

  const text=await response.text();

  let data;

  try{
    data=JSON.parse(text);
  }catch(e){
    throw new Error(
      '伺服器回傳內容不是有效 JSON'
    );
  }

  if(!data || data.ok!==true){
    throw new Error(
      data && data.message
        ? data.message
        : 'API 執行失敗'
    );
  }

  return data;
}


/* =========================
   建立訂單
========================= */

async function createOrder(){

  const status=
    document.getElementById('createStatus');

  const btn=
    document.getElementById('createBtn');

  const customer=
    document.getElementById('customer').value.trim();

  const product=
    document.getElementById('product').value.trim();

  const qty=
    Number(document.getElementById('qty').value);

  const price=
    Number(document.getElementById('price').value);

  const twdPrice=
    Number(document.getElementById('twdPrice').value);


  if(!currentUser){
    showCreateError('請先選擇操作人');
    return;
  }

  if(!customer){
    showCreateError('請輸入顧客');
    return;
  }

  if(!product){
    showCreateError('請輸入商品');
    return;
  }

  if(!Number.isFinite(qty)||qty<=0){
    showCreateError('數量必須大於 0');
    return;
  }

  if(!Number.isFinite(price)||price<0){
    showCreateError('請確認日幣售價');
    return;
  }

  if(!Number.isFinite(twdPrice)||twdPrice<0){
    showCreateError('請確認台幣售價');
    return;
  }


  btn.disabled=true;
  btn.textContent='⟳ 正在建立訂單…';

  status.className='status';
  status.textContent='正在寫入 Google Sheets…';


  try{

    const data=await apiRequest(
      'createOrder',
      {
        user:currentUser,
        customer:customer,
        product:product,
        qty:qty,
        price:price,
        twdPrice:twdPrice
      }
    );

    renderData(data);

    status.className='status success';
    status.innerHTML=
      '<strong>✅ 訂單建立成功</strong><br>'+
      'Google Sheets 已更新，畫面也已取得最新資料。';

    document.getElementById('customer').value='';
    document.getElementById('product').value='';
    document.getElementById('qty').value=1;
    document.getElementById('price').value=0;
    document.getElementById('twdPrice').value=0;

    updateTotal();

  }catch(error){

    showCreateError(error.message);

  }finally{

    btn.disabled=false;
    btn.textContent='➕ 建立訂單';
  }
}


function showCreateError(message){

  const status=
    document.getElementById('createStatus');

  status.className='status error';

  status.innerHTML=
    '<strong>❌ 無法建立訂單</strong><br>'+
    escapeHtml(message);
}


/* =========================
   同步
========================= */

async function loadData(){

  const btn=document.getElementById('syncBtn');
  const status=document.getElementById('syncStatus');

  btn.disabled=true;
  btn.textContent='⟳ 正在同步…';

  status.className='status';
  status.textContent='正在取得 Google Sheets 最新資料…';

  try{

    const data=await apiRequest('getData',{});

    renderData(data);

    status.className='status success';

    status.innerHTML=
      '<strong>✅ Google Sheets 同步成功</strong><br>'+
      '目前資料已更新。';

  }catch(error){

    status.className='status error';

    status.innerHTML=
      '<strong>❌ 同步失敗</strong><br>'+
      escapeHtml(error.message);

  }finally{

    btn.disabled=false;
    btn.textContent='🔄 同步最新資料';
  }
}


/* =========================
   資料顯示
========================= */

function renderData(data){

  currentData=data||{};

  const orders=
    Array.isArray(data.orders)
      ? data.orders
      : [];

  const purchases=
    Array.isArray(data.purchases)
      ? data.purchases
      : [];

  currentData.orders=orders;
  currentData.purchases=purchases;

  document.getElementById('orderCount').textContent=
    orders.length+' 筆';

  document.getElementById('purchaseCount').textContent=
    purchases.length+' 筆';

  document.getElementById('rate').textContent=
    Number(data.rate||0).toFixed(3);

  document.getElementById('backendVersion').textContent=
    data.version||'?';

  document.getElementById('syncTime').textContent=
    '☁ 最後同步：'+
    (data.syncedAt || new Date().toLocaleString('zh-TW'));

  renderBuyList();
  renderOrders(orders);
}


/* =========================
   商品彙整
========================= */

function aggregateProducts(){

  const map={};

  currentData.orders.forEach(function(o){

    const cancelled=
      o.cancelled===true ||
      o.status==='已取消';

    if(cancelled) return;

    const product=String(o.product||'').trim();

    if(!product) return;

    if(!map[product]){
      map[product]={
        product:product,
        need:0,
        bought:0
      };
    }

    map[product].need+=Number(o.qty)||0;
  });


  currentData.purchases.forEach(function(p){

    const product=String(p.product||'').trim();

    if(!product) return;

    if(!map[product]){
      map[product]={
        product:product,
        need:0,
        bought:0
      };
    }

    /*
      舊版邏輯：
      缺貨不算實際購買數量。
    */

    if(p.status!=='缺貨'){
      map[product].bought+=Number(p.qty)||0;
    }
  });


  return Object.values(map)
    .map(function(x){

      x.left=Math.max(
        0,
        x.need-x.bought
      );

      return x;
    })
    .sort(function(a,b){

      if(a.left>0 && b.left===0) return -1;
      if(a.left===0 && b.left>0) return 1;

      return a.product.localeCompare(
        b.product,
        'zh-Hant'
      );
    });
}


/* =========================
   採買清單
========================= */

function renderBuyList(){

  const box=document.getElementById('buyList');

  const items=aggregateProducts();

  if(!items.length){

    box.innerHTML=
      '<div class="empty">目前沒有需要採買的商品。</div>';

    return;
  }

  box.innerHTML=items.map(function(x){

    const finished=x.left<=0;

    return `
      <div class="buyItem ${finished?'buyDone':''}">

        <div class="buyTitle">
          ${escapeHtml(x.product)}
        </div>

        <div class="buyStats">

          <div class="stat">
            <div class="statLabel">訂購</div>
            <div class="statValue">
              ${numberText(x.need)}
            </div>
          </div>

          <div class="stat">
            <div class="statLabel">已購</div>
            <div class="statValue">
              ${numberText(x.bought)}
            </div>
          </div>

          <div class="stat ${finished?'done':'need'}">
            <div class="statLabel">尚缺</div>
            <div class="statValue">
              ${numberText(x.left)}
            </div>
          </div>

        </div>

        ${
          finished

          ? `<button class="buyBtn" disabled>
               ✅ 已買齊
             </button>`

          : `<button class="buyBtn"
               onclick='openBuyModal(${JSON.stringify(x.product)},${x.left})'>
               🛒 登記採買
             </button>`
        }

      </div>
    `;

  }).join('');
}


/* =========================
   打開採買
========================= */

function openBuyModal(product,left){

  currentBuyProduct=product;
  currentBuyLeft=Number(left)||0;

  document.getElementById('buyProductName').textContent=
    '商品：'+product;

  document.getElementById('buyNeedInfo').innerHTML=
    '目前尚缺 <strong>'+
    numberText(currentBuyLeft)+
    '</strong> 件';

  document.getElementById('buyQty').value=
    currentBuyLeft>0 ? 1 : 0;

  document.getElementById('buyCost').value=0;
  document.getElementById('buyNote').value='';

  document.getElementById('buyStatus').innerHTML='';

  document.getElementById('overBuyWarning').style.display=
    'none';

  restoreUser();

  document.getElementById('buyModal')
    .classList.add('open');
}


function closeBuyModal(){

  document.getElementById('buyModal')
    .classList.remove('open');

  currentBuyProduct='';
  currentBuyLeft=0;
}


/* =========================
   超買提醒
========================= */

function checkOverBuy(){

  const qty=
    Number(document.getElementById('buyQty').value)||0;

  const box=
    document.getElementById('overBuyWarning');

  if(qty>currentBuyLeft){

    box.style.display='block';

    box.textContent=
      '⚠️ 目前尚缺 '+currentBuyLeft+
      ' 件，本次輸入 '+qty+
      ' 件，會多買 '+(qty-currentBuyLeft)+' 件。';

  }else{

    box.style.display='none';
  }
}


/* =========================
   儲存採買
========================= */

async function savePurchase(){

  const btn=
    document.getElementById('saveBuyBtn');

  const status=
    document.getElementById('buyStatus');

  const qty=
    Number(document.getElementById('buyQty').value);

  const cost=
    Number(document.getElementById('buyCost').value);

  const note=
    document.getElementById('buyNote').value.trim();


  if(!currentUser){

    showBuyError('請先選擇採買人');
    return;
  }

  if(!currentBuyProduct){

    showBuyError('沒有選擇商品');
    return;
  }

  if(!Number.isFinite(qty)||qty<=0){

    showBuyError('採買數量必須大於 0');
    return;
  }

  if(!Number.isFinite(cost)||cost<0){

    showBuyError('請確認實際總成本');
    return;
  }


  /*
    如果買超過尚缺數量，
    再確認一次。
  */

  if(qty>currentBuyLeft){

    const ok=confirm(
      '目前尚缺 '+currentBuyLeft+
      ' 件。\n\n'+
      '本次輸入 '+qty+
      ' 件，會多買 '+(qty-currentBuyLeft)+
      ' 件。\n\n確定要繼續嗎？'
    );

    if(!ok) return;
  }


  btn.disabled=true;
  btn.textContent='⟳ 正在寫入採買紀錄…';

  status.className='status';
  status.textContent='正在更新 Google Sheets…';


  try{

    const data=await apiRequest(
      'recordPurchase',
      {
        user:currentUser,
        product:currentBuyProduct,
        qty:qty,
        cost:cost,
        note:note
      }
    );

    /*
      API 已回傳最新 Google Sheets 資料。
    */

    renderData(data);

    status.className='status success';

    status.innerHTML=
      '<strong>✅ 採買紀錄建立成功</strong><br>'+
      'Google Sheets 已更新。';

    /*
      稍微停一下，讓使用者看到成功訊息。
    */

    setTimeout(function(){
      closeBuyModal();
    },700);

  }catch(error){

    showBuyError(error.message);

  }finally{

    btn.disabled=false;
    btn.textContent='✅ 確認採買';
  }
}


function showBuyError(message){

  const status=
    document.getElementById('buyStatus');

  status.className='status error';

  status.innerHTML=
    '<strong>❌ 無法記錄採買</strong><br>'+
    escapeHtml(message);
}


/* =========================
   訂單列表
========================= */

function renderOrders(orders){

  const box=document.getElementById('orderList');

  if(!orders.length){

    box.innerHTML=
      '<div class="empty">目前沒有訂單。</div>';

    return;
  }

  const arr=orders.slice().reverse();

  box.innerHTML=arr.map(function(order){

    const cancelled=
      order.cancelled===true ||
      order.status==='已取消';

    const id=order.id||'';
    const customer=order.customer||'';
    const product=order.product||'';
    const qty=Number(order.qty)||0;
    const creator=order.creator||'';

    const price=Number(order.price)||0;
    const twdPrice=Number(order.twdPrice)||0;

    /*
      如果後端沒有 twdTotal，
      前端自行計算。
    */

    const twdTotal=
      Number(order.twdTotal) ||
      (qty*twdPrice);

    return `

      <div class="order ${cancelled?'cancelled':''}">

        <div class="orderTop">

          <div class="orderId">
            ${escapeHtml(id)}
          </div>

          ${
            cancelled

            ? '<span class="badge cancelBadge">已取消</span>'

            : '<span class="badge">有效訂單</span>'
          }

        </div>

        <div class="row">
          👤 顧客：${escapeHtml(customer)}
        </div>

        <div class="row">
          🛍 商品：${escapeHtml(product)}
        </div>

        <div class="row">
          🔢 數量：${numberText(qty)}
        </div>

        <div class="row">
          🇯🇵 日幣售價：¥${money(price)}／件
        </div>

        <div class="row">
          🇹🇼 台幣售價：NT$${money(twdPrice)}／件
        </div>

        <div class="row">
          💰 訂單總額：NT$${money(twdTotal)}
        </div>

        ${
          creator
          ? `<div class="row">
               🙋 建單：${escapeHtml(creator)}
             </div>`
          : ''
        }

      </div>
    `;

  }).join('');
}


/* =========================
   小工具
========================= */

function money(value){

  return Math.round(Number(value)||0)
    .toLocaleString('zh-TW');
}


function numberText(value){

  const n=Number(value)||0;

  if(Number.isInteger(n)){
    return n.toLocaleString('zh-TW');
  }

  return n.toLocaleString('zh-TW');
}


function escapeHtml(value){

  return String(
    value==null ? '' : value
  )
  .replaceAll('&','&amp;')
  .replaceAll('<','&lt;')
  .replaceAll('>','&gt;')
  .replaceAll('"','&quot;')
  .replaceAll("'",'&#039;');
}

   頁面啟動

restoreUser();
updateTotal();
